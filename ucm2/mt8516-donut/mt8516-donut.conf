# SPDX-License-Identifier: BSD-3-Clause
# Amazon Echo Dot 3rd gen (donut): MT8516 AFE card "mt8516-donut" (link order
# DL1 / UL1 / DL1_AWB, jack link "HP"), TAS2770 speaker amplifier, 2x
# TLV320ADC3101 microphone array, DL1_AWB echo reference, headphone jack on
# the SoC's integrated codec (mt8167) with ACCDET jack detection.
#
# One verb per DL1 configuration: the jack use case opens DL1 at 48000 Hz
# S24_LE, the speaker at 96000 Hz S16/S24_LE, and the codec DL path tops out
# at 48 kHz, so DL1 must be re-opened between the verbs, never opened by
# both at once.  While the Headphones verb is active the speaker stays muted:
# a 48 kHz DL1 stream also powers the I2S back end through the default DAPM
# route, and the TAS2770 would render it.
Syntax 4

SectionUseCase."Speaker" {
	File "/mt8516-donut/Speaker.conf"
	Comment "Speaker: DL1 at 96 kHz S24_LE"
}

SectionUseCase."Headphones" {
	File "/mt8516-donut/Headphones.conf"
	Comment "Headphone jack: DL1 at 48 kHz S24_LE"
}

BootSequence [
	# TAS2770 starts muted: control 0 is the TLV minimum -100.5 dB
	# (scale is inverted); 121 is -40 dB, 201 is 0 dB.  The Speaker verb
	# re-raises it.
	cset "name='Speaker Playback Volume' 0"
	# analog amp gain at its minimum (+11 dB of 11..21 dB)
	cset "name='Amp Gain Volume' 0"
	# integrated-codec headphone amp at 0 dB (range -2..+12 dB)
	cset "name='Audio Amp Playback Volume' 1,1"
	# Microphone array: both ADC3101s on the IN1 inputs, single-ended
	# (unverified wiring: the M4 bring-up must confirm the inputs each
	# microphone really uses), PGA at the lidar-parity +35 dB starting
	# point (0.5 dB steps, 80 = +40 dB maximum) - the vendor gain for
	# donut is unknown; calibrate on hardware.
	cset "name='ADC1 Left Input IN_1L Capture Switch' on"
	cset "name='ADC1 Right Input IN_1R Capture Switch' on"
	cset "name='ADC2 Left Input IN_1L Capture Switch' on"
	cset "name='ADC2 Right Input IN_1R Capture Switch' on"
	cset "name='ADC1 PGA Capture Switch' on,on"
	cset "name='ADC1 PGA Capture Volume' 70,70"
	cset "name='ADC2 PGA Capture Switch' on,on"
	cset "name='ADC2 PGA Capture Volume' 70,70"
]
