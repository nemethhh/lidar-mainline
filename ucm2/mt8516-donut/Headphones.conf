# Headphones verb: DL1 open at 48 kHz S24_LE for the integrated codec's HP
# back end.  The whole time this verb is active the TAS2770 speaker path must
# stay muted: a 48 kHz DL1 stream also powers the I2S back end through the
# default DAPM route.

SectionVerb {
	EnableSequence [
		# the vendor-parity trap: the I2S back end runs with DL1, so
		# the speaker amp is muted for the duration of the verb
		cset "name='Speaker Playback Volume' 0"
		# headphone amp at the conservative 0 dB (range -2..+12 dB)
		cset "name='Audio Amp Playback Volume' 1,1"
	]
	DisableSequence [
		# the speaker stays muted until the Speaker verb raises it
		cset "name='Speaker Playback Volume' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphone jack (integrated codec, ACCDET jack detection)"

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackRate 48000
		PlaybackFormat "S24_LE"
		PlaybackMixerElem "Audio Amp Playback Volume"
	}
}

SectionDevice."Mic" {
	Comment "Microphone array (2x ADC3101, TDM, 24 bits in 32-bit slots)"

	Value {
		CapturePriority 100
		CaptureChannels 4
		CapturePCM "hw:${CardId},1"
		CaptureRate 16000
		CaptureFormat "S32_LE"
	}
}

SectionDevice."Echo Reference" {
	Comment "DL1 loopback capture (follows the playback format)"

	Value {
		CapturePriority 60
		CaptureChannels 2
		CapturePCM "hw:${CardId},2"
		CaptureRate 48000
		CaptureFormat "S24_LE"
	}
}
