# SPDX-License-Identifier: BSD-3-Clause
# Speaker verb: DL1 open at 96 kHz (the TAS2770 renders 48 kHz content as
# static; the vendor plays 16 and 24 bit here).

SectionVerb {
	EnableSequence [
		# speaker at the conservative bring-up level (-40 dB); the
		# boot sequence left it muted
		cset "name='Speaker Playback Volume' 121"
		cset "name='Amp Gain Volume' 0"
	]
	DisableSequence [
		# leaving the verb: safe-mute again (the switch to Headphones
		# applies the same mute itself)
		cset "name='Speaker Playback Volume' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker (TAS2770 on the I2S back end)"

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackRate 96000
		PlaybackFormat "S24_LE"
		PlaybackMixerElem "Speaker Playback Volume"
	}
}

SectionDevice."Mic" {
	Comment "Microphone array (2x ADC3101, TDM, 24 bits in 32-bit slots)"

	Value {
		CapturePriority 100
		CaptureChannels 4
		CapturePCM "hw:${CardId},1"
		CaptureRate 16000
		CaptureFormat "S32_LE"
	}
}

SectionDevice."Echo Reference" {
	Comment "DL1 loopback capture (follows the playback format)"

	Value {
		CapturePriority 60
		CaptureChannels 2
		CapturePCM "hw:${CardId},2"
		CaptureRate 96000
		CaptureFormat "S24_LE"
	}
}
