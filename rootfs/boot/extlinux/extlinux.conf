# donut test system boot entry (U-Boot sysboot, mmc 0:<userdata>).
# Paths are absolute inside this filesystem: sysboot resolves relative
# paths against the directory of this file instead (/boot/extlinux).
# Load addresses live in U-Boot's environment (kernel_addr_r & co),
# not here.
default donut-test
timeout 1

label donut-test
	kernel /boot/Image.gz
	fdt /boot/mediatek/mt8516-amazon-donut.dtb
	initrd /boot/initramfs.gz
	# Consoles on the UART test pads (ttyS0, last = primary) and on the
	# USB CDC ACM gadget (ttyGS0; exists once userspace binds it).
	append console=ttyGS0,115200 console=ttyS0,921600n8 earlycon=uart8250,mmio32,0x11005000 loglevel=7
