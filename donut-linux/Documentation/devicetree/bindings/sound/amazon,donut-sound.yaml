%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amazon,donut-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amazon Echo Dot (3rd generation) sound card

maintainers:
  - LeagueRaAINi <19365835+LeagueRaINi@users.noreply.github.com>

description:
  Sound card of the MediaTek MT8516 based Amazon Echo Dot (3rd
  generation), codename "donut".  A TAS2770 smart amplifier on the I2S
  output of the SoC drives the speaker.  Four microphones are digitized
  by two stereo ADCs, which share the data line of the TDM input of the
  SoC, and the playback is looped back for echo reference.  The
  headphone jack on the integrated codec of the SoC is an optional
  link of the card.

properties:
  compatible:
    const: amazon,donut-sound

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT8516 audio front end.

  speaker-dai-link:
    type: object
    description: Container for the codec of the playback DAI link.

    properties:
      codec:
        type: object

        properties:
          sound-dai:
            maxItems: 1
            description: phandle of the smart amplifier.

        required:
          - sound-dai

        additionalProperties: false

    required:
      - codec

    additionalProperties: false

  mic-dai-link:
    type: object
    description: Container for the codecs of the microphone DAI link.

    properties:
      codec:
        type: object

        properties:
          sound-dai:
            minItems: 1
            maxItems: 2
            description:
              phandles of the microphone ADCs in the order of their slot
              pairs in the TDM frame.

        required:
          - sound-dai

        additionalProperties: false

    required:
      - codec

    additionalProperties: false

  jack-dai-link:
    type: object
    description: |
      Container for the codec of the headphone jack DAI link ("HP", the
      integrated codec of the SoC).  Optional; without it the card has
      no jack link and the DL1 front end only serves the speaker.

    properties:
      codec:
        type: object

        properties:
          sound-dai:
            maxItems: 1
            description: phandle of the integrated codec.

        required:
          - sound-dai

        additionalProperties: false

    required:
      - codec

    additionalProperties: false

required:
  - compatible
  - mediatek,platform
  - speaker-dai-link
  - mic-dai-link

additionalProperties: false

examples:
  - |
    sound {
        compatible = "amazon,donut-sound";
        mediatek,platform = <&afe>;

        speaker-dai-link {
            codec {
                sound-dai = <&spk_amp>;
            };
        };

        mic-dai-link {
            codec {
                sound-dai = <&adc0>, <&adc1>;
            };
        };

        jack-dai-link {
            codec {
                sound-dai = <&mt8167_codec>;
            };
        };
    };

...
