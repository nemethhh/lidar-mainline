%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8167-codec.yaml#
$schema: http://devicetree/meta-schemas/core.yaml#

title: MediaTek MT8167/MT8516 integrated audio codec

maintainers:
  - LeagueRaINi <19365835+LeagueRaINi@users.noreply.github.com>

description: |
  The integrated audio codec of the MediaTek MT8167/MT8516 SoC: the
  analog headphone and line outputs, the analog and digital microphone
  inputs and the DC-offset compensation of the headphone drivers.  It
  has no register block of its own; its registers are the analog
  baseband block of the audio front end (AFE offsets 0x0f00..0x0f4c)
  and the AUDIO_CODEC block of the apmixedsys (offsets 0x0700..0x0710),
  reached through phandles.

properties:
  compatible:
    const: mediatek,mt8167-codec

  "#sound-dai-cells":
    const: 0

  clocks:
    maxItems: 1
    description: the audio bus clock (topckgen CLK_TOP_AUDIO).

  clock-names:
    const: bus

  mediatek,afe-regmap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle of the audio front end holding the ABB registers.

  mediatek,apmixedsys-regmap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle of the apmixedsys syscon holding the codec control
      block.

  mediatek,dmic-wire-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      wiring of the digital microphone inputs:
      0 - one wire (both channels on one pin)
      1 - two wire (one pin per channel)

  mediatek,dmic-ch-phase:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    items:
      maximum: 7
    description: latch phase (in clock cycles, 0-7) of the left and right
      digital microphone channels.

  mediatek,dmic-rate-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      clock rate of the digital microphone inputs:
      0 - 1.625 MHz
      1 - 3.25 MHz

  mediatek,headphone-cap-sel:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]
    description: |
      capacitor at the headphone outputs, selecting the depop charge
      current of the VCM generator:
      0 - up to 10 uF
      1 - up to 22 uF
      2 - up to 33 uF
      3 - up to 47 uF

required:
  - compatible
  - "#sound-dai-cells"
  - clocks
  - clock-names
  - mediatek,afe-regmap
  - mediatek,apmixedsys-regmap

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt8516-clk.h>

    audio-codec {
        compatible = "mediatek,mt8167-codec";
        #sound-dai-cells = <0>;
        clocks = <&topckgen CLK_TOP_AUDIO>;
        clock-names = "bus";
        mediatek,afe-regmap = <&afe>;
        mediatek,apmixedsys-regmap = <&apmixedsys>;
        mediatek,dmic-wire-mode = <1>;
        mediatek,headphone-cap-sel = <1>;
    };

...
